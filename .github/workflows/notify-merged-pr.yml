# Publish this repo's merged pull requests to the org MQTT broker (topic ci/pr/merged)
# via the shared mqtt-pr-notify action. Consumed downstream by the PR-summary pipeline.
name: notify merged PR

on:
  pull_request:
    types: [closed]

jobs:
  mqtt-notify:
    # Only merged PRs — a closed-but-not-merged PR is ignored.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: AI-Gruppe/ai-internal_reusable-actions_sw/mqtt-pr-notify@master
        with:
          mqtt_password: ${{ secrets.MQTT_CI_PASSWORD }}
